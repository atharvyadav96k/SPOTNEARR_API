global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'user-svc'
    static_configs:
      - targets: ['user-service:8080']
    metrics_path: '/metrics'

  - job_name: 'vendor-svc'
    static_configs:
      - targets: ['vendor-service:8080']
    metrics_path: '/metrics'

  - job_name: 'search-svc'
    static_configs:
      - targets: ['search-service:8080']
    metrics_path: '/metrics'
