server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project"]
    relabel_configs:
      # Default: carry compose service name as-is for infra containers
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service

      # Rename the three API services to match Prometheus service labels
      # so the Grafana $service variable works across both metrics and logs
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        regex: "(user|vendor|search)-service"
        replacement: "$1-svc"
        target_label: service

      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container

      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
