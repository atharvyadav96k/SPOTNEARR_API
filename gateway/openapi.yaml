swagger: "2.0"
info:
  title: spotnearr-api
  version: "1.0"
schemes:
  - https
x-google-backend:
  address: ${backend_url}
  protocol: h2
paths:
  "/**":
    get:
      operationId: proxyGet
      responses:
        "200":
          description: OK
    post:
      operationId: proxyPost
      responses:
        "200":
          description: OK
    put:
      operationId: proxyPut
      responses:
        "200":
          description: OK
    patch:
      operationId: proxyPatch
      responses:
        "200":
          description: OK
    delete:
      operationId: proxyDelete
      responses:
        "200":
          description: OK