services:


  postgres:
    image: postgres:16-alpine
    container_name: spotnearr_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: spotnearr_user       # primary DB (User Service)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - spotnearr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d spotnearr_user"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: spotnearr_redis
    ports:
      - "6379:6379"
    networks:
      - spotnearr-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: spotnearr_user_svc
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-motherfather}
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/spotnearr_user
      CACHE_URL: redis://redis:6379
      CACHE_PASSWORD: ""
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-1x0000000000000000000000000000000AA}
      CAPTCHA_URL: https://challenges.cloudflare.com/turnstile/v0/siteverify
      VENDOR_SERVICE_URL: http://vendor-service:8081
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - spotnearr-network
    restart: unless-stopped

  vendor-service:
    build:
      context: .
      dockerfile: services/vendor/Dockerfile
    container_name: spotnearr_vendor_svc
    environment:
      PORT: "8081"
      JWT_SECRET: ${JWT_SECRET:-motherfather}
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/spotnearr_vendor
      CACHE_URL: redis://redis:6379
      CACHE_PASSWORD: ""
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-1x0000000000000000000000000000000AA}
      CAPTCHA_URL: https://challenges.cloudflare.com/turnstile/v0/siteverify
      USER_SERVICE_URL: http://user-service:8080
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - spotnearr-network
    restart: unless-stopped

  search-service:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    container_name: spotnearr_search_svc
    environment:
      PORT: "8082"
      JWT_SECRET: ${JWT_SECRET:-motherfather}
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/spotnearr_search
      VENDOR_DB_URL: postgresql://admin:admin123@postgres:5432/spotnearr_vendor
      CACHE_URL: redis://redis:6379
      CACHE_PASSWORD: ""
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vendor-service:
        condition: service_started
    networks:
      - spotnearr-network
    restart: unless-stopped

# ── Shared resources ──────────────────────────────────────────────────────

networks:
  spotnearr-network:
    driver: bridge

volumes:
  pgdata:
