services:

  gateway:
    image: nginx:alpine
    container_name: spotnearr_gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - vendor-service
      - search-service
    networks:
      - spotnearr-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: spotnearr_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    networks:
      - spotnearr-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: spotnearr_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: spotnearr_user
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - spotnearr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d spotnearr_user"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: spotnearr_redis
    ports:
      - "6379:6379"
    networks:
      - spotnearr-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: spotnearr_user_svc
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-motherfather}
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/spotnearr_user?sslmode=disable
      CACHE_URL: redis://redis:6379
      CACHE_PASSWORD: ""
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-1x0000000000000000000000000000000AA}
      CAPTCHA_URL: https://challenges.cloudflare.com/turnstile/v0/siteverify
      VENDOR_SERVICE_URL: http://vendor-service:8080
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - spotnearr-network
    restart: unless-stopped

  vendor-service:
    build:
      context: .
      dockerfile: Dockerfile.vendor
    container_name: spotnearr_vendor_svc
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-motherfather}
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/spotnearr_vendor?sslmode=disable
      CACHE_URL: redis://redis:6379
      CACHE_PASSWORD: ""
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-1x0000000000000000000000000000000AA}
      CAPTCHA_URL: https://challenges.cloudflare.com/turnstile/v0/siteverify
      USER_SERVICE_URL: http://user-service:8080
      SEARCH_SERVICE_URL: http://search-service:8080
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - spotnearr-network
    restart: unless-stopped

  typesense:
    image: typesense/typesense:26.0
    container_name: spotnearr_typesense
    command: ["--data-dir=/data", "--api-key=${TYPESENSE_API_KEY:-dev-api-key}", "--enable-cors"]
    volumes:
      - typesense_data:/data
    ports:
      - "8108:8108"
    networks:
      - spotnearr-network
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  search-service:
    build:
      context: .
      dockerfile: Dockerfile.search
    container_name: spotnearr_search_svc
    environment:
      PORT: "8080"
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672/
      CACHE_URL: redis://redis:6379
      CACHE_PASSWORD: ""
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev-api-key}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      typesense:
        condition: service_healthy
    networks:
      - spotnearr-network
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: spotnearr_cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      - spotnearr-network
    restart: unless-stopped

  redis_exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: spotnearr_redis_exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - spotnearr-network
    restart: unless-stopped

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: spotnearr_postgres_exporter
    environment:
      DATA_SOURCE_NAME: postgresql://admin:admin123@postgres:5432/spotnearr_user?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spotnearr-network
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    container_name: spotnearr_loki
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki.yml
    ports:
      - "3100:3100"
    networks:
      - spotnearr-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.2
    container_name: spotnearr_promtail
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki
    networks:
      - spotnearr-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: spotnearr_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    depends_on:
      - user-service
      - vendor-service
      - search-service
    networks:
      - spotnearr-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.1
    container_name: spotnearr_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - spotnearr-network
    restart: unless-stopped

networks:
  spotnearr-network:
    driver: bridge

volumes:
  pgdata:
  typesense_data:
  prometheus_data:
  grafana_data:
  loki_data:
