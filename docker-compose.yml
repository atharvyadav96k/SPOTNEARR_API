services:

  gateway:
    image: nginx:alpine
    container_name: spotnearr_gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - vendor-service
      - search-service
    networks:
      - spotnearr-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: spotnearr_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    networks:
      - spotnearr-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'

  postgres:
    image: postgres:16-alpine
    container_name: spotnearr_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: spotnearr_user
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - spotnearr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d spotnearr_user"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'

  redis:
    image: redis:7-alpine
    container_name: spotnearr_redis
    ports:
      - "6379:6379"
    networks:
      - spotnearr-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: spotnearr_user_svc
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-motherfather}
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/spotnearr_user?sslmode=disable
      CACHE_URL: redis://redis:6379
      CACHE_PASSWORD: ""
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-1x0000000000000000000000000000000AA}
      CAPTCHA_URL: https://challenges.cloudflare.com/turnstile/v0/siteverify
      VENDOR_SERVICE_URL: http://vendor-service:8080
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - spotnearr-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'

  vendor-service:
    build:
      context: .
      dockerfile: Dockerfile.vendor
    container_name: spotnearr_vendor_svc
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-motherfather}
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/spotnearr_vendor?sslmode=disable
      CACHE_URL: redis://redis:6379
      CACHE_PASSWORD: ""
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-1x0000000000000000000000000000000AA}
      CAPTCHA_URL: https://challenges.cloudflare.com/turnstile/v0/siteverify
      USER_SERVICE_URL: http://user-service:8080
      SEARCH_SERVICE_URL: http://search-service:8080
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - spotnearr-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'

  search-service:
    build:
      context: .
      dockerfile: Dockerfile.search
    container_name: spotnearr_search_svc
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-motherfather}
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/spotnearr_search?sslmode=disable
      CACHE_URL: redis://redis:6379
      CACHE_PASSWORD: ""
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - spotnearr-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'

networks:
  spotnearr-network:
    driver: bridge

volumes:
  pgdata:
