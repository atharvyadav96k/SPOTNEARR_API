      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: update_spotlight
      working-directory: business/spotlights/update_spotlight
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  spotlights-delete:
    needs: detect-changes
    if: needs.detect-changes.outputs.spotlights-delete == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
