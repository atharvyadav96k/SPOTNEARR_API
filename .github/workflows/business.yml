name: Deploy Business Functions

on:
  workflow_call:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      categories-add:        ${{ steps.filter.outputs.categories-add }}
      categories-get:        ${{ steps.filter.outputs.categories-get }}

      plans-add:             ${{ steps.filter.outputs.plans-add }}
      plans-get-active:      ${{ steps.filter.outputs.plans-get-active }}
      plans-get-business:    ${{ steps.filter.outputs.plans-get-business }}
      plans-set-active:      ${{ steps.filter.outputs.plans-set-active }}

      spotlights-create:     ${{ steps.filter.outputs.spotlights-create }}
      spotlights-get:        ${{ steps.filter.outputs.spotlights-get }}
      spotlights-update:     ${{ steps.filter.outputs.spotlights-update }}
      spotlights-delete:     ${{ steps.filter.outputs.spotlights-delete }}

      products-new:          ${{ steps.filter.outputs.products-new }}
      products-get:          ${{ steps.filter.outputs.products-get }}
      products-update:       ${{ steps.filter.outputs.products-update }}
      products-delete:       ${{ steps.filter.outputs.products-delete }}
      products-get-business: ${{ steps.filter.outputs.products-get-business }}

      inventory-create:      ${{ steps.filter.outputs.inventory-create }}
      inventory-get:         ${{ steps.filter.outputs.inventory-get }}
      inventory-update:      ${{ steps.filter.outputs.inventory-update }}
      inventory-delete:      ${{ steps.filter.outputs.inventory-delete }}
      inventory-get-business: ${{ steps.filter.outputs.inventory-get-business }}

      transactions-complete-order: ${{ steps.filter.outputs.transactions-complete-order }}
      transactions-create-order:   ${{ steps.filter.outputs.transactions-create-order }}

      location-create:       ${{ steps.filter.outputs.location-create }}
      location-get:          ${{ steps.filter.outputs.location-get }}
      location-update:       ${{ steps.filter.outputs.location-update }}
      location-delete:       ${{ steps.filter.outputs.location-delete }}

      profile-info:          ${{ steps.filter.outputs.profile-info }}
      profile-delete-image:  ${{ steps.filter.outputs.profile-delete-image }}
      profile-set-image:     ${{ steps.filter.outputs.profile-set-image }}

      get-incoming-claims:   ${{ steps.filter.outputs.get-incoming-claims }}
      accept-claim:          ${{ steps.filter.outputs.accept-claim }}
      reject-claim:          ${{ steps.filter.outputs.reject-claim }}

    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            categories-add:
              - 'business/categories/add_categories/**'
            categories-get:
              - 'business/categories/get_categories/**'

            plans-add:
              - 'business/plans/add_plans/**'
            plans-get-active:
              - 'business/plans/get_active_plan/**'
            plans-get-business:
              - 'business/plans/get_business_plans/**'
            plans-set-active:
              - 'business/plans/set_business_active_plan/**'

            spotlights-create:
              - 'business/spotlights/create_spotlight/**'
            spotlights-get:
              - 'business/spotlights/get_spotlights/**'
            spotlights-update:
              - 'business/spotlights/update_spotlight/**'
            spotlights-delete:
              - 'business/spotlights/delete_spotlight/**'

            products-new:
              - 'business/products/new_product/**'
            products-get:
              - 'business/products/get_products/**'
            products-update:
              - 'business/products/update_products/**'
            products-delete:
              - 'business/products/delete_products/**'
            products-get-business:
              - 'business/products/get_business_products/**'

            inventory-create:
              - 'business/inventory/create/**'
            inventory-get:
              - 'business/inventory/get/**'
            inventory-update:
              - 'business/inventory/update/**'
            inventory-delete:
              - 'business/inventory/delete/**'
            inventory-get-business:
              - 'business/inventory/get_by_business/**'

            transactions-complete-order:
              - 'business/transactions/complete_order/**'
            transactions-create-order:
              - 'business/transactions/create_order/**'

            location-create:
              - 'business/location/create_location/**'
            location-get:
              - 'business/location/get_location/**'
            location-update:
              - 'business/location/update_location/**'
            location-delete:
              - 'business/location/delete_location/**'

            profile-info:
              - 'business/profile/profile-info/**'
            profile-delete-image:
              - 'business/profile/profile-image/delete-profile-image/**'
            profile-set-image:
              - 'business/profile/profile-image/set-profile-image-in-db/**'

            get-incoming-claims:
              - 'business/claims/get-incoming-claims/**'
            accept-claim:
              - 'business/claims/accept-claim/**'
            reject-claim:
              - 'business/claims/reject-claim/**'

  categories-add:
    needs: detect-changes
    if: needs.detect-changes.outputs.categories-add == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: add_categories
      working-directory: business/categories/add_categories
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  categories-get:
    needs: detect-changes
    if: needs.detect-changes.outputs.categories-get == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: get_categories
      working-directory: business/categories/get_categories
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

# ─── Plans ─────────────────────────────────────────────────────
  plans-add:
    needs: detect-changes
    if: needs.detect-changes.outputs.plans-add == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: add_plans
      working-directory: business/plans/add_plans
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  plans-get-active:
    needs: detect-changes
    if: needs.detect-changes.outputs.plans-get-active == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: get_active_plan
      working-directory: business/plans/get_active_plan
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  plans-get-business:
    needs: detect-changes
    if: needs.detect-changes.outputs.plans-get-business == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: get_business_plans
      working-directory: business/plans/get_business_plans
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  plans-set-active:
    needs: detect-changes
