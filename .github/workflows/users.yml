name: Deploy User Functions

on:
  workflow_call:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      follow:                 ${{ steps.filter.outputs.follow }}
      unfollow:               ${{ steps.filter.outputs.unfollow }}
      get-following:          ${{ steps.filter.outputs.get-following }}

      follow-user:            ${{ steps.filter.outputs.follow-user }}
      unfollow-user:          ${{ steps.filter.outputs.unfollow-user }}
      get-followers:          ${{ steps.filter.outputs.get-followers }}
      get-following-users:    ${{ steps.filter.outputs.get-following-users }}

      like:                   ${{ steps.filter.outputs.like }}
      dislike:                ${{ steps.filter.outputs.dislike }}

      followed-spotlights:    ${{ steps.filter.outputs.followed-spotlights }}
      liked-spotlights:       ${{ steps.filter.outputs.liked-spotlights }}
      spotlight-by-location:  ${{ steps.filter.outputs.spotlight-by-location }}
      get-saved-spotlights:   ${{ steps.filter.outputs.get-saved-spotlights }}

      comment-create:         ${{ steps.filter.outputs.comment-create }}
      comment-update:         ${{ steps.filter.outputs.comment-update }}
      comment-delete:         ${{ steps.filter.outputs.comment-delete }}
      comment-get-by-spotlight: ${{ steps.filter.outputs.comment-get-by-spotlight }}

      save-product:           ${{ steps.filter.outputs.save-product }}
      unsave-product:         ${{ steps.filter.outputs.unsave-product }}
      get-saved-products:     ${{ steps.filter.outputs.get-saved-products }}

      product-like:           ${{ steps.filter.outputs.product-like }}
      product-unlike:         ${{ steps.filter.outputs.product-unlike }}
      get-liked-products:     ${{ steps.filter.outputs.get-liked-products }}

      user-profile-info:      ${{ steps.filter.outputs.user-profile-info }}
      user-delete-image:      ${{ steps.filter.outputs.user-delete-image }}
      nearby-products:        ${{ steps.filter.outputs.nearby-products }}
      search-products:        ${{ steps.filter.outputs.search-products }}

      claim-product:          ${{ steps.filter.outputs.claim-product }}
      get-my-claims:          ${{ steps.filter.outputs.get-my-claims }}
      cancel-claim:           ${{ steps.filter.outputs.cancel-claim }}
      mark-received:          ${{ steps.filter.outputs.mark-received }}

      get-liked-businesses:   ${{ steps.filter.outputs.get-liked-businesses }}
      offers-by-business:     ${{ steps.filter.outputs.offers-by-business }}
      add-review:             ${{ steps.filter.outputs.add-review }}
      get-reviews:            ${{ steps.filter.outputs.get-reviews }}
      get-notifications:      ${{ steps.filter.outputs.get-notifications }}
      mark-notification-read: ${{ steps.filter.outputs.mark-notification-read }}

    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            follow:
              - 'users/follows/follow-business/**'
            unfollow:
              - 'users/follows/unfollow-business/**'
            get-following:
              - 'users/follows/get-following-businesses/**'

            follow-user:
              - 'users/follows/follow-user/**'
            unfollow-user:
              - 'users/follows/unfollow-user/**'
            get-followers:
              - 'users/follows/get-followers/**'
            get-following-users:
              - 'users/follows/get-following-users/**'

            like:
              - 'users/likes/business-like/**'
            dislike:
              - 'users/likes/business-dislike/**'

            followed-spotlights:
              - 'users/spotlights/followed_business_spotlights/**'
            liked-spotlights:
              - 'users/spotlights/get_liked_spotlights/**'
            spotlight-by-location:
              - 'users/spotlights/get_spotlight_by_location/**'
            get-saved-spotlights:
              - 'users/spotlights/get-saved/**'

            comment-create:
              - 'users/spotlights/comments/create/**'
            comment-update:
              - 'users/spotlights/comments/update/**'
            comment-delete:
              - 'users/spotlights/comments/delete/**'
            comment-get-by-spotlight:
              - 'users/spotlights/comments/get_by_spotlight/**'

            save-product:
              - 'users/products/save/**'
            unsave-product:
              - 'users/products/unsave/**'
            get-saved-products:
              - 'users/products/get-saved/**'

            product-like:
              - 'users/likes/product-like/**'
            product-unlike:
              - 'users/likes/product-unlike/**'
            get-liked-products:
              - 'users/likes/get-liked-products/**'

            user-profile-info:
              - 'users/profile/profile-info/**'
            user-delete-image:
              - 'users/profile/profile-image/delete-profile-image/**'
            nearby-products:
              - 'users/products/near_by_products/**'
            search-products:
              - 'users/products/search_proudcts/**'

            claim-product:
              - 'users/claims/claim-product/**'
            get-my-claims:
              - 'users/claims/get-my-claims/**'
            cancel-claim:
              - 'users/claims/cancel-claim/**'
            mark-received:
              - 'users/claims/mark-received/**'

            get-liked-businesses:
              - 'users/likes/get-liked-businesses/**'
            offers-by-business:
              - 'users/offers/get-offers-by-business/**'
            add-review:
              - 'users/reviews/add-review/**'
            get-reviews:
              - 'users/reviews/get-reviews/**'
            get-notifications:
              - 'users/notifications/get-notifications/**'
            mark-notification-read:
              - 'users/notifications/mark-read/**'


# ═══════════════════════════════════════════════════════════════
# Deploy jobs — one per function.
# Each job is independent, so you can add custom inputs, env vars,
# tf_vars, etc. per function without affecting any other.
# ═══════════════════════════════════════════════════════════════

# ─── Follows ───────────────────────────────────────────────────
  follow:
    needs: detect-changes
    if: needs.detect-changes.outputs.follow == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: user-follow
      working-directory: users/follows/follow-business
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  unfollow:
    needs: detect-changes
    if: needs.detect-changes.outputs.unfollow == 'true'
