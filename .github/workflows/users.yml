    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: delete_spotlight_comment
      working-directory: users/spotlights/comments/delete
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  comment-get-by-spotlight:
    needs: detect-changes
