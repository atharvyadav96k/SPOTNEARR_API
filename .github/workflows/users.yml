name: Deploy User Functions

on:
  workflow_call:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      follow:                 ${{ steps.filter.outputs.follow }}
      unfollow:               ${{ steps.filter.outputs.unfollow }}
      get-following:          ${{ steps.filter.outputs.get-following }}

      like:                   ${{ steps.filter.outputs.like }}
      dislike:                ${{ steps.filter.outputs.dislike }}

      followed-spotlights:    ${{ steps.filter.outputs.followed-spotlights }}
      liked-spotlights:       ${{ steps.filter.outputs.liked-spotlights }}
      spotlight-by-location:  ${{ steps.filter.outputs.spotlight-by-location }}

      comment-create:         ${{ steps.filter.outputs.comment-create }}
      comment-update:         ${{ steps.filter.outputs.comment-update }}
      comment-delete:         ${{ steps.filter.outputs.comment-delete }}
      comment-get-by-spotlight: ${{ steps.filter.outputs.comment-get-by-spotlight }}

    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            follow:
              - 'users/follows/follow-business/**'
            unfollow:
              - 'users/follows/unfollow-business/**'
            get-following:
              - 'users/follows/get-following-businesses/**'

            like:
              - 'users/likes/business-like/**'
            dislike:
              - 'users/likes/business-dislike/**'

            followed-spotlights:
              - 'users/spotlights/followed_business_spotlights/**'
            liked-spotlights:
              - 'users/spotlights/get_liked_spotlights/**'
            spotlight-by-location:
              - 'users/spotlights/get_spotlight_by_location/**'

            comment-create:
              - 'users/spotlights/comments/create/**'
            comment-update:
              - 'users/spotlights/comments/update/**'
            comment-delete:
              - 'users/spotlights/comments/delete/**'
            comment-get-by-spotlight:
              - 'users/spotlights/comments/get_by_spotlight/**'


# ═══════════════════════════════════════════════════════════════
# Deploy jobs — one per function.
# Each job is independent, so you can add custom inputs, env vars,
# tf_vars, etc. per function without affecting any other.
# ═══════════════════════════════════════════════════════════════

# ─── Follows ───────────────────────────────────────────────────
  follow:
    needs: detect-changes
    if: needs.detect-changes.outputs.follow == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: user-follow
      working-directory: users/follows/follow-business
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  unfollow:
    needs: detect-changes
    if: needs.detect-changes.outputs.unfollow == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: user-unfollow
      working-directory: users/follows/unfollow-business
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  get-following:
    needs: detect-changes
    if: needs.detect-changes.outputs.get-following == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: user-get-following-businesses
      working-directory: users/follows/get-following-businesses
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

# ─── Likes ─────────────────────────────────────────────────────
  like:
    needs: detect-changes
    if: needs.detect-changes.outputs.like == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: user-like
      working-directory: users/likes/business-like
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  dislike:
    needs: detect-changes
    if: needs.detect-changes.outputs.dislike == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: user-dislike
      working-directory: users/likes/business-dislike
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

# ─── Spotlights ────────────────────────────────────────────────
  followed-spotlights:
    needs: detect-changes
    if: needs.detect-changes.outputs.followed-spotlights == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: get_followed_spotlights
      working-directory: users/spotlights/followed_business_spotlights
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  liked-spotlights:
    needs: detect-changes
    if: needs.detect-changes.outputs.liked-spotlights == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: get_liked_spotlights
      working-directory: users/spotlights/get_liked_spotlights
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  spotlight-by-location:
    needs: detect-changes
    if: needs.detect-changes.outputs.spotlight-by-location == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: get_spotlight_by_location
      working-directory: users/spotlights/get_spotlight_by_location
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

# ─── Spotlight Comments ────────────────────────────────────────
  comment-create:
    needs: detect-changes
    if: needs.detect-changes.outputs.comment-create == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: create_spotlight_comment
      working-directory: users/spotlights/comments/create
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  comment-update:
    needs: detect-changes
    if: needs.detect-changes.outputs.comment-update == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: update_spotlight_comment
      working-directory: users/spotlights/comments/update
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  comment-delete:
    needs: detect-changes
    if: needs.detect-changes.outputs.comment-delete == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: delete_spotlight_comment
      working-directory: users/spotlights/comments/delete
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  comment-get-by-spotlight:
    needs: detect-changes
    if: needs.detect-changes.outputs.comment-get-by-spotlight == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: get_spotlight_comments
      working-directory: users/spotlights/comments/get_by_spotlight
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit