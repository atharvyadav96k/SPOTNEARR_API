name: Deploy User Functions

on:
  workflow_call:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      follow:                 ${{ steps.filter.outputs.follow }}
      unfollow:               ${{ steps.filter.outputs.unfollow }}
      get-following:          ${{ steps.filter.outputs.get-following }}

      follow-user:            ${{ steps.filter.outputs.follow-user }}
      unfollow-user:          ${{ steps.filter.outputs.unfollow-user }}
      get-followers:          ${{ steps.filter.outputs.get-followers }}
      get-following-users:    ${{ steps.filter.outputs.get-following-users }}

      like:                   ${{ steps.filter.outputs.like }}
      dislike:                ${{ steps.filter.outputs.dislike }}

      followed-spotlights:    ${{ steps.filter.outputs.followed-spotlights }}
      liked-spotlights:       ${{ steps.filter.outputs.liked-spotlights }}
      spotlight-by-location:  ${{ steps.filter.outputs.spotlight-by-location }}
      get-saved-spotlights:   ${{ steps.filter.outputs.get-saved-spotlights }}

      comment-create:         ${{ steps.filter.outputs.comment-create }}
      comment-update:         ${{ steps.filter.outputs.comment-update }}
      comment-delete:         ${{ steps.filter.outputs.comment-delete }}
      comment-get-by-spotlight: ${{ steps.filter.outputs.comment-get-by-spotlight }}

      save-product:           ${{ steps.filter.outputs.save-product }}
      unsave-product:         ${{ steps.filter.outputs.unsave-product }}
      get-saved-products:     ${{ steps.filter.outputs.get-saved-products }}

    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            follow:
              - 'users/follows/follow-business/**'
            unfollow:
              - 'users/follows/unfollow-business/**'
            get-following:
              - 'users/follows/get-following-businesses/**'

            follow-user:
              - 'users/follows/follow-user/**'
            unfollow-user:
              - 'users/follows/unfollow-user/**'
            get-followers:
              - 'users/follows/get-followers/**'
            get-following-users:
              - 'users/follows/get-following-users/**'

            like:
              - 'users/likes/business-like/**'
            dislike:
              - 'users/likes/business-dislike/**'

            followed-spotlights:
              - 'users/spotlights/followed_business_spotlights/**'
            liked-spotlights:
              - 'users/spotlights/get_liked_spotlights/**'
            spotlight-by-location:
              - 'users/spotlights/get_spotlight_by_location/**'
            get-saved-spotlights:
              - 'users/spotlights/get-saved/**'

            comment-create:
              - 'users/spotlights/comments/create/**'
            comment-update:
              - 'users/spotlights/comments/update/**'
            comment-delete:
              - 'users/spotlights/comments/delete/**'
            comment-get-by-spotlight:
              - 'users/spotlights/comments/get_by_spotlight/**'

            save-product:
              - 'users/products/save/**'
            unsave-product:
              - 'users/products/unsave/**'
            get-saved-products:
              - 'users/products/get-saved/**'


# ═══════════════════════════════════════════════════════════════
# Deploy jobs — one per function.
# Each job is independent, so you can add custom inputs, env vars,
# tf_vars, etc. per function without affecting any other.
# ═══════════════════════════════════════════════════════════════

# ─── Follows ───────────────────────────────────────────────────
  follow:
    needs: detect-changes
    if: needs.detect-changes.outputs.follow == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: user-follow
      working-directory: users/follows/follow-business
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  unfollow:
    needs: detect-changes
    if: needs.detect-changes.outputs.unfollow == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: user-unfollow
      working-directory: users/follows/unfollow-business
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  get-following:
    needs: detect-changes
    if: needs.detect-changes.outputs.get-following == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: user-get-following-businesses
      working-directory: users/follows/get-following-businesses
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

# ─── Likes ─────────────────────────────────────────────────────
