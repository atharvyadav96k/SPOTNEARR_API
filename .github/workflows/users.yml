    secrets: inherit

  get-following-users:
    needs: detect-changes
    if: needs.detect-changes.outputs.get-following-users == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: get_user_following
      working-directory: users/follows/get-following-users
