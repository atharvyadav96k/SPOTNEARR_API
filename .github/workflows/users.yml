    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: get_followed_spotlights
      working-directory: users/spotlights/followed_business_spotlights
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  liked-spotlights:
