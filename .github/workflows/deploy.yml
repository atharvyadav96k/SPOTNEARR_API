name: Deploy Cloud Functions

on:
  push:
    branches:
      - main
    paths:
      - 'bridge-service/**'
      - 'app/**'
      - 'gateway/**'

jobs:
  detect-domains:
    runs-on: ubuntu-latest
    outputs:
      bridge: ${{ steps.changes.outputs.bridge }}
      app:    ${{ steps.changes.outputs.app }}
      gateway: ${{ steps.changes.outputs.gateway }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            bridge:
              - 'bridge-service/**'
            app:
              - 'app/**'
            gateway:
              - 'gateway/**'

  bridge:
    needs: detect-domains
    if: needs.detect-domains.outputs.bridge == 'true'
    uses: ./.github/workflows/bridge.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  app:
    needs: detect-domains
    if: needs.detect-domains.outputs.app == 'true'
    uses: ./.github/workflows/app.yml
    permissions:
      id-token: write
      contents: read
    with:
      working-directory: app
      gcp_region: ${{ vars.GCP_REGION }}
      captcha_url: ${{ vars.CAPTCHA_URL }}       
      captcha_secret_key: ${{ vars.CAPTCHA_SECRET_KEY }}
    secrets: inherit
    
  gateway:
    needs: detect-domains
    if: needs.detect-domains.outputs.gateway == 'true'
    uses: ./.github/workflows/api-gateway.yml
    permissions:
      id-token: write
      contents: read
    with:
      working-directory: gateway
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit