name: Deploy

on:
  push:
    branches: [main, staging]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  STATE_DIR: states
  TF_PLUGIN_CACHE_DIR: $HOME/.terraform.d/plugin-cache

jobs:
  infrastructure:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Terraform States
        run: |
          mkdir -p $TF_PLUGIN_CACHE_DIR
          mkdir -p ../${{ env.STATE_DIR }}/infrastructure
          mkdir -p ../${{ env.STATE_DIR }}/user
          mkdir -p ../${{ env.STATE_DIR }}/search
          mkdir -p ../${{ env.STATE_DIR }}/vendor

      - name: Pull images
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker pull rabbitmq:3.13-management-alpine
          docker pull typesense/typesense:26.0
          docker pull golang:1.25-alpine
          docker pull alpine:3.21

      - name: Infrastructure Creation
        working-directory: infrastructure
        env:
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          TF_VAR_typesense_api_key: ${{ secrets.TYPESENSE_API_KEY }}
        run: |
          terraform init \
            -backend-config="path=../../states/infrastructure/terraform.tfstate"

          terraform plan
          terraform apply -auto-approve

  deploy-servers:
    needs: infrastructure
    uses: ./.github/workflows/server-deploy.yml
    secrets: inherit
    with:
        environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}