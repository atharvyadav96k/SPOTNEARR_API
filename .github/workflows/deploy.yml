name: Deploy Cloud Functions

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'bridge-service/**'
      - 'app/**'
      - 'gateway/**'

jobs:
  detect-domains:
    runs-on: ubuntu-latest
    outputs:
      bridge:      ${{ steps.changes.outputs.bridge }}
      app:         ${{ steps.changes.outputs.app }}
      gateway:     ${{ steps.changes.outputs.gateway }}
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          else
            echo "environment=prod" >> $GITHUB_OUTPUT
          fi

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            bridge:
              - 'bridge-service/**'
            app:
              - 'app/**'
            gateway:
              - 'gateway/**'

  bridge:
    needs: detect-domains
    if: needs.detect-domains.outputs.bridge == 'true'
    uses: ./.github/workflows/bridge.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  app:
    needs: detect-domains
    if: needs.detect-domains.outputs.app == 'true'
    uses: ./.github/workflows/app.yml
    permissions:
      id-token: write
      contents: read
    with:
      working-directory: app
      gcp_region: ${{ vars.GCP_REGION }}
      captcha_url: ${{ vars.CAPTCHA_URL }}
      environment: ${{ needs.detect-domains.outputs.environment }}
    secrets: inherit
    
  gateway:
    needs: detect-domains
    if: needs.detect-domains.outputs.gateway == 'true'
    uses: ./.github/workflows/api-gateway.yml
    permissions:
      id-token: write
      contents: read
    with:
      working-directory: gateway
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit