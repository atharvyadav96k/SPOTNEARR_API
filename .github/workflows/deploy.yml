name: Deploy

on:
  push:
    branches: [main, staging]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  STATE_DIR: states

jobs:
  infrastructure:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Terraform States
        run: |
          mkdir -p ../${{ env.STATE_DIR }}/infrastructure
          mkdir -p ../${{ env.STATE_DIR }}/user
          mkdir -p ../${{ env.STATE_DIR }}/search
          mkdir -p ../${{ env.STATE_DIR }}/vendor

      - name: Infrastructure Creation
        working-directory: infrastructure
        run: |
          terraform init \
            -backend-config="state_path=../states/infrastructure/terraform.tfstate"

          terraform plan
          terraform apply -auto-approve

  deploy-servers:
    needs: infrastructure
    uses: ./.github/workflows/server-deploy.yml
    with:
        environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}