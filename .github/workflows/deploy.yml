name: Deploy

on:
  push:
    branches: [main, staging]

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      app:         ${{ steps.changes.outputs.app }}
      vendor:      ${{ steps.changes.outputs.vendor }}
      search:      ${{ steps.changes.outputs.search }}
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=prod" >> $GITHUB_OUTPUT
          fi

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            app:
              - 'app/cmd/**'
              - 'pkg/**'
              - 'database/**'
              - 'Dockerfile.app'
            vendor:
              - 'services/vendor/**'
              - 'pkg/**'
              - 'database/**'
              - 'Dockerfile.vendor'
            search:
              - 'services/search/**'
              - 'pkg/**'
              - 'database/**'
              - 'Dockerfile.search'

  app:
    needs: detect
    if: needs.detect.outputs.app == 'true'
    uses: ./.github/workflows/service.yml
    permissions:
      id-token: write
      contents: read
    with:
      service_name:      app
      dockerfile:        Dockerfile.app
      cloud_run_service: user-service-${{ needs.detect.outputs.environment }}
      gcp_region:        ${{ vars.GCP_REGION }}
      environment:       ${{ needs.detect.outputs.environment }}
    secrets: inherit

  vendor:
    needs: detect
    if: needs.detect.outputs.vendor == 'true'
    uses: ./.github/workflows/service.yml
    permissions:
      id-token: write
      contents: read
    with:
      service_name:      vendor
      dockerfile:        Dockerfile.vendor
      cloud_run_service: vendor-service-${{ needs.detect.outputs.environment }}
      gcp_region:        ${{ vars.GCP_REGION }}
      environment:       ${{ needs.detect.outputs.environment }}
    secrets: inherit

  search:
    needs: detect
    if: needs.detect.outputs.search == 'true'
    uses: ./.github/workflows/service.yml
    permissions:
      id-token: write
      contents: read
    with:
      service_name:      search
      dockerfile:        Dockerfile.search
      cloud_run_service: search-service-${{ needs.detect.outputs.environment }}
      gcp_region:        ${{ vars.GCP_REGION }}
      environment:       ${{ needs.detect.outputs.environment }}
    secrets: inherit
