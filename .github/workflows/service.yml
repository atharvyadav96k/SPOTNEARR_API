name: Build and Deploy Service

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Short name for image tag (app, vendor, search)'
        type: string
        required: true
      dockerfile:
        description: 'Dockerfile at workspace root (e.g. Dockerfile.app)'
        type: string
        required: true
      terraform_dir:
        description: 'Directory containing main.tf (e.g. app, services/vendor)'
        type: string
        required: true
      gcp_region:
        type: string
        required: true
      environment:
        type: string
        required: true
      captcha_url:
        type: string
        required: false
        default: 'https://challenges.cloudflare.com/turnstile/v0/siteverify'
    secrets:
      GCP_PROJECT_ID:
        required: true
      GCP_PROJECT_NUMBER:
        required: true
      GCP_SA_EMAIL:
        required: true
      GCP_WIF_PROVIDER:
        required: true
      GCP_BUCKET_NAME:
        required: true
      DATABASE_URL:
        required: false
      DEV_DATABASE_URL:
        required: false
      VENDOR_DATABASE_URL:
        required: false
      DEV_VENDOR_DATABASE_URL:
        required: false
      SEARCH_DATABASE_URL:
        required: false
      DEV_SEARCH_DATABASE_URL:
        required: false
      CACHE_URL:
        required: false
      CACHE_PASSWORD:
        required: false
      JWT_SECRET:
        required: false
      DEV_JWT_SECRET:
        required: false
      DEV_CAPTCHA_SECRET_KEY:
        required: false
      PROD_CAPTCHA_SECRET_KEY:
        required: false
      USER_SERVICE_URL:
        required: false
      SEARCH_SERVICE_URL:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.terraform_dir }}
    env:
      IMAGE: ${{ inputs.gcp_region }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gcf-artifacts/${{ inputs.service_name }}:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ inputs.gcp_region }}-docker.pkg.dev --quiet

      - name: Build and push image
        working-directory: ${{ github.workspace }}
        run: |
          docker build -f ${{ inputs.dockerfile }} -t ${{ env.IMAGE }} .
          docker push ${{ env.IMAGE }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ secrets.GCP_BUCKET_NAME }}" \
            -backend-config="prefix=cloud-run/${{ inputs.service_name }}-${{ inputs.environment }}"

      - name: Terraform Plan
        run: terraform plan -input=false -lock=false
        env:
          TF_VAR_project_id:          ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_project_number:      ${{ secrets.GCP_PROJECT_NUMBER }}
          TF_VAR_region:              ${{ inputs.gcp_region }}
          TF_VAR_service_account:     ${{ secrets.GCP_SA_EMAIL }}
          TF_VAR_image:               ${{ env.IMAGE }}
          TF_VAR_environment:         ${{ inputs.environment }}
          TF_VAR_database_url:        ${{ inputs.environment == 'dev' && secrets.DEV_DATABASE_URL || secrets.DATABASE_URL }}
          TF_VAR_vendor_database_url: ${{ secrets.VENDOR_DATABASE_URL }}
          TF_VAR_search_database_url: ${{ secrets.SEARCH_DATABASE_URL }}
          TF_VAR_vendor_db_url:       ${{ inputs.environment == 'dev' && secrets.DEV_VENDOR_DATABASE_URL || secrets.VENDOR_DATABASE_URL }}
          TF_VAR_cache_url:           ${{ secrets.CACHE_URL }}
          TF_VAR_cache_password:      ${{ secrets.CACHE_PASSWORD }}
          TF_VAR_jwt_secret:          ${{ inputs.environment == 'dev' && secrets.DEV_JWT_SECRET || secrets.JWT_SECRET }}
          TF_VAR_captcha_url:         ${{ inputs.captcha_url }}
          TF_VAR_captcha_secret_key:  ${{ inputs.environment == 'dev' && secrets.DEV_CAPTCHA_SECRET_KEY || secrets.PROD_CAPTCHA_SECRET_KEY }}
          TF_VAR_user_service_url:    ${{ secrets.USER_SERVICE_URL }}
          TF_VAR_search_service_url:  ${{ secrets.SEARCH_SERVICE_URL }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_project_id:          ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_project_number:      ${{ secrets.GCP_PROJECT_NUMBER }}
          TF_VAR_region:              ${{ inputs.gcp_region }}
          TF_VAR_service_account:     ${{ secrets.GCP_SA_EMAIL }}
          TF_VAR_image:               ${{ env.IMAGE }}
          TF_VAR_environment:         ${{ inputs.environment }}
          TF_VAR_database_url:        ${{ inputs.environment == 'dev' && secrets.DEV_DATABASE_URL || secrets.DATABASE_URL }}
          TF_VAR_vendor_database_url: ${{ secrets.VENDOR_DATABASE_URL }}
          TF_VAR_search_database_url: ${{ secrets.SEARCH_DATABASE_URL }}
          TF_VAR_vendor_db_url:       ${{ inputs.environment == 'dev' && secrets.DEV_VENDOR_DATABASE_URL || secrets.VENDOR_DATABASE_URL }}
          TF_VAR_cache_url:           ${{ secrets.CACHE_URL }}
          TF_VAR_cache_password:      ${{ secrets.CACHE_PASSWORD }}
          TF_VAR_jwt_secret:          ${{ inputs.environment == 'dev' && secrets.DEV_JWT_SECRET || secrets.JWT_SECRET }}
          TF_VAR_captcha_url:         ${{ inputs.captcha_url }}
          TF_VAR_captcha_secret_key:  ${{ inputs.environment == 'dev' && secrets.DEV_CAPTCHA_SECRET_KEY || secrets.PROD_CAPTCHA_SECRET_KEY }}
          TF_VAR_user_service_url:    ${{ secrets.USER_SERVICE_URL }}
          TF_VAR_search_service_url:  ${{ secrets.SEARCH_SERVICE_URL }}
