name: Deploy Go App

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      gcp_region:
        required: true
        type: string
      captcha_url:
        required: true
        type: string
      environment:
        required: true
        type: string
        description: 'Deployment environment: dev or prod'

    secrets:
      GCP_PROJECT_ID:
        required: true
      GCP_PROJECT_NUMBER:
        required: true
      GCP_SA_EMAIL:
        required: true
      GCP_WIF_PROVIDER:
        required: true
      GCP_BUCKET_NAME:
        required: true
      DATABASE_URL:
        required: true
      DEV_DATABASE_URL:
        required: true
      CACHE_URL:
        required: true
      JWT_SECRET:
        required: true
      DEV_JWT_SECRET:
        required: true
      CACHE_PASSWORD:
        required: false
      DEV_CAPTCHA_SECRET_KEY:
        required: true
      PROD_CAPTCHA_SECRET_KEY:
        required: true
      TAILSCALE_AUTH_KEY:
        required: false
      SSH_PRIVATE_KEY:
        required: false

jobs:
  deploy-cloud:
    runs-on: ubuntu-latest

    if: ${{ inputs.environment == 'dev' || inputs.environment == 'prod' }}

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    env:
      IMAGE_NAME: ${{ inputs.gcp_region }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gcf-artifacts/app
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ inputs.gcp_region }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ secrets.GCP_BUCKET_NAME }}" \
            -backend-config="prefix=cloud-run/app-${{ inputs.environment }}"

      - name: Terraform Plan
        run: terraform plan -input=false
        env:
          TF_VAR_project_id:         ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_project_number:     ${{ secrets.GCP_PROJECT_NUMBER }}
          TF_VAR_region:             ${{ inputs.gcp_region }}
          TF_VAR_service_account:    ${{ secrets.GCP_SA_EMAIL }}
          TF_VAR_image:              ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          TF_VAR_environment:        ${{ inputs.environment }}
          TF_VAR_database_url:       ${{ inputs.environment == 'dev' && secrets.DEV_DATABASE_URL || secrets.DATABASE_URL }}
          TF_VAR_cache_url:          ${{ secrets.CACHE_URL }}
          TF_VAR_captcha_secret_key: ${{ inputs.environment == 'dev' && secrets.DEV_CAPTCHA_SECRET_KEY || secrets.PROD_CAPTCHA_SECRET_KEY }}
          TF_VAR_captcha_url:        ${{ inputs.captcha_url }}
          TF_VAR_jwt_secret:         ${{ inputs.environment == 'dev' && secrets.DEV_JWT_SECRET || secrets.JWT_SECRET }}
          TF_VAR_cache_password:     ${{ secrets.CACHE_PASSWORD }}
          TF_VAR_artifact_repo:      ${{ inputs.environment == 'dev' && 'dev' || 'gcf-artifacts' }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_project_id:         ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_project_number:     ${{ secrets.GCP_PROJECT_NUMBER }}
          TF_VAR_region:             ${{ inputs.gcp_region }}
          TF_VAR_service_account:    ${{ secrets.GCP_SA_EMAIL }}
          TF_VAR_image:              ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          TF_VAR_environment:        ${{ inputs.environment }}
          TF_VAR_database_url:       ${{ inputs.environment == 'dev' && secrets.DEV_DATABASE_URL || secrets.DATABASE_URL }}
          TF_VAR_cache_url:          ${{ secrets.CACHE_URL }}
          TF_VAR_captcha_secret_key: ${{ inputs.environment == 'dev' && secrets.DEV_CAPTCHA_SECRET_KEY || secrets.PROD_CAPTCHA_SECRET_KEY }}
          TF_VAR_captcha_url:        ${{ inputs.captcha_url }}
          TF_VAR_jwt_secret:         ${{ inputs.environment == 'dev' && secrets.DEV_JWT_SECRET || secrets.JWT_SECRET }}
          TF_VAR_cache_password:     ${{ secrets.CACHE_PASSWORD }}
          TF_VAR_artifact_repo:      ${{ inputs.environment == 'dev' && 'dev' || 'gcf-artifacts' }}

# ==================== LOCAL SERVER DEPLOYMENT (STAGING) ====================
  deploy-local-staging:
    runs-on: ubuntu-latest
    if: ${{ inputs.environment == 'staging' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Connects securely to your private Tailscale network
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # Authenticates and authorizes the host signature
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Clean key scanning for your active machine
          ssh-keyscan -H 100.73.67.35 >> ~/.ssh/known_hosts

      - name: Push to Staging Server and Run Systemd Automation
        run: |
          # Use the exact machine IP from your dashboard screen
          ssh atharv96k@100.73.67.35 \
            "JWT_SECRET='${{ secrets.DEV_JWT_SECRET }}' \
             DATABASE_URL='${{ secrets.DEV_DATABASE_URL }}' \
             CACHE_URL='${{ secrets.CACHE_URL }}' \
             CACHE_PASSWORD='${{ secrets.CACHE_PASSWORD }}' \
             CAPTCHA_URL='${{ inputs.captcha_url }}' \
             CAPTCHA_SECRET_KEY='${{ secrets.DEV_CAPTCHA_SECRET_KEY }}' \
             bash -s" << 'EOF'
            
            cd ~/SPOTNEARR_API
            git fetch --all
            git reset --hard origin/staging
            
            cp app/start_server.sh /home/atharv96k/start_server.sh
            chmod +x /home/atharv96k/start_server.sh

            sudo systemctl restart spotnearr.service
          EOF