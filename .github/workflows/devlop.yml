name: Multiple Go functions deploy

on:
  push:
    branches:
      - main  
    paths:
      - 'demo/**'
  workflow_dispatch:
jobs:

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      demo: ${{ steps.filter.outcome.demo }}

    steps:
      - uses: actions/checkout@v3

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            demo:
              - 'demo/**'

  deploy-demo:
    needs: detect-changes
    if: needs.detect-changes.outputs.demo == 'true'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: demo

    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_project_number: ${{ secrets.GCP_PROJECT_NUMBER }}
      TF_VAR_service_account: ${{ secrets.GCP_SA_EMAIL }}
      TF_VAR_region : ${{ vars.GCP_REGION }}
      
    steps:
      - uses: actions/checkout@v3

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{secrets.GCP_WIF_PROVIDER}}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
        
      - uses: hashicorp/setup-terraform@v3

      - name: Create Source Zip
        run: |
          cd function
          zip -r ../source.zip .

      - run: terraform init
      - run: terraform plan -input=false
      - run: terraform apply -auto-approve -input=false