name: Multiple Go Functions Deploy

on:
  push:
    branches:
      - main
    paths:
      # ----------- Auth Functions ---------
      - 'auth/business/register/**'
      - 'auth/business/login/**'
      - 'auth/user/login/**'
      - 'auth/user/register/**'

      # ----------- Bridge Service Functions ---------
      - 'bridge-service/filter-follow/**'
      - 'bridge-service/filter-likes/**'
      - 'bridge-service/push_notification/**'

      # ----------- Business Functions ---------
      - 'business/categories/add_categories/**'
      - 'business/categories/get_categories/**'

      - 'business/plans/add_plans/**'
      - 'business/plans/get_active_plan/**'
      - 'business/plans/get_business_plans/**'
      - 'business/plans/set_business_active_plan/**'

      - 'business/spotlights/create_spotlight/**'
      - 'business/spotlights/get_spotlights/**'
      - 'business/spotlights/update_spotlight/**'
      - 'business/spotlights/delete_spotlight/**'

      - 'business/products/new_product/**'
      - 'business/products/get_products/**'
      - 'business/products/update_products/**'
      - 'business/products/delete_products/**'
      - 'business/products/get_business_products/**'

      - 'business/inventory/create/**'
      - 'business/inventory/delete/**'
      - 'business/inventory/get/**'
      - 'business/inventory/get_by_business/**'

      - 'business/location/create_location/**'
      - 'business/location/get_location/**'
      - 'business/location/update_location/**'
      - 'business/location/delete_location/**'
      
      - 'business/transactions/complete_order/**'
      - 'business/transactions/create_order/**'


      # ---------- User Functions ---------
      - 'users/follows/follow-business/**'
      - 'users/follows/unfollow-business/**'
      - 'users/follows/get-following-businesses/**'
      
      - 'users/likes/business-like/**'
      - 'users/likes/business-dislike/**'


      # --------- Spotlight Functions ---------
      - 'users/spotlights/followed_business_spotlights/**'
      - 'users/spotlights/get_liked_spotlights/**'
      - 'users/spotlights/get_spotlight_by_location/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      # ---------- Auth Functions ---------
      business-register: ${{ steps.filter.outputs.business-register }}
      business-login: ${{ steps.filter.outputs.business-login }}
      user-login: ${{ steps.filter.outputs.user-login }}
      user-register: ${{ steps.filter.outputs.user-register }}

      # --------- Bridge Service Functions ---------
      bridge-service-push-notification: ${{ steps.filter.outputs.bridge-service-push-notification }}
      
      # --------- Business Functions ---------
      business-categories-add: ${{ steps.filter.outputs.business-categories-add }}
      business-categories-get: ${{ steps.filter.outputs.business-categories-get }}

      business-plans-add: ${{ steps.filter.outputs.business-plans-add }}
      business-plans-get-active: ${{ steps.filter.outputs.business-plans-get-active }}
      business-plans-get-business: ${{ steps.filter.outputs.business-plans-get-business }}
      business-plans-set-active: ${{ steps.filter.outputs.business-plans-set-active }}

      business-spotlights-create: ${{ steps.filter.outputs.business-spotlights-create }}
      business-spotlights-get: ${{ steps.filter.outputs.business-spotlights-get }}
      business-spotlights-update: ${{ steps.filter.outputs.business-spotlights-update }}
      business-spotlights-delete: ${{ steps.filter.outputs.business-spotlights-delete }}  

      business-products-new: ${{ steps.filter.outputs.business-products-new }}
      business-products-get: ${{ steps.filter.outputs.business-products-get }}
      business-products-update: ${{ steps.filter.outputs.business-products-update }}
      business-products-delete: ${{ steps.filter.outputs.business-products-delete }}
      business-products-get-business: ${{ steps.filter.outputs.business-products-get-business }}

      business-inventory-create: ${{steps.filter.outputs.business-inventory-create }}
      business-inventory-update: ${{steps.filter.outputs.business-inventory-create }}
      business-inventory-delete: ${{steps.filter.outputs.business-inventory-create }}
      business-inventory-get: ${{steps.filter.outputs.business-inventory-create }}
      business-inventory-get-by-business: ${{steps.filter.outputs.business-inventory-create }}

      business-transactions-complete-order: ${{ steps.filter.outputs.business-transactions-complete-order }}
      business-transactions-create_order: ${{ steps.filter.outputs.business-transactions-create_order }}

      business-location-create_location: ${{ steps.filter.outputs.business-location-create_location }}
      business-location-get_location: ${{ steps.filter.outputs.business-location-get_location }}
      business-location-update_location: ${{ steps.filter.outputs.business-location-update_location }}
      business-location-delete_location: ${{ steps.filter.outputs.business-location-delete_location }}

      # --------- User Functions ---------
      users-follow: ${{ steps.filter.outputs.users-follow }}
      users-unfollow: ${{ steps.filter.outputs.users-unfollow }}
      users-get-following-businesses: ${{ steps.filter.outputs.users-get-following-businesses }}

      users-business-like: ${{ steps.filter.outputs.users-business-like }}
      users-business-dislike: ${{ steps.filter.outputs.users-business-dislike }}

      # ---------- Spotlight Functions ---------
      users-followed-business-spotlights: ${{ steps.filter.outputs.users-followed-business-spotlights }}
      users-get-liked-spotlights: ${{ steps.filter.outputs.users-get-liked-spotlights }}
      users-get-spotlight-by-location: ${{ steps.filter.outputs.users-get-spotlight-by-location }}
      
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
          
            business-register:
              - 'auth/business/register/**'
            business-login:
              - 'auth/business/login/**'
            user-login:
              - 'auth/user/login/**'      
            user-register:
              - 'auth/user/register/**'  


            bridge-service-push-notification:
              - 'bridge-service/push_notification/**'


            business-categories-add:
              - 'business/categories/add_categories/**'
            business-categories-get:
              - 'business/categories/get_categories/**'

            business-plans-add:
              - 'business/plans/add_plans/**'
            business-plans-get-active:
              - 'business/plans/get_active_plan/**'
            business-plans-get-business:
              - 'business/plans/get_business_plans/**'
            business-plans-set-active:
              - 'business/plans/set_business_active_plan/**'

            business-spotlights-create:
              - 'business/spotlights/create_spotlight/**'
            business-spotlights-get:
              - 'business/spotlights/get_spotlights/**'
            business-spotlights-update:
              - 'business/spotlights/update_spotlight/**'
            business-spotlights-delete:
              - 'business/spotlights/delete_spotlight/**'

            business-products-new:
              - 'business/products/new_product/**'
            business-products-get:
              - 'business/products/get_products/**'
            business-products-update:
              - 'business/products/update_products/**'
            business-products-delete:
              - 'business/products/delete_products/**'
            business-products-get-business:
              - 'business/products/get_business_products/**'

            business-inventory-create:
              - 'business/inventory/create/**'
            business-inventory-update:
              - 'business/inventory/update/**'
            business-inventory-get:
              - 'business/inventory/get/**'
            business-inventory-get-by-business:
              - 'business/inventory/get_by_business/**'

            business-transactions-complete-order:
              - 'business/transactions/complete_order/**'
            business-transactions-create_order:
              - 'business/transactions/create_order/**'

            business-location-create_location:
              - 'business/location/create_location/**'
            business-location-get_location:
              - 'business/location/get_location/**'
            business-location-update_location:
              - 'business/location/update_location/**'
            business-location-delete_location:
              - 'business/location/delete_location/**'


            users-follow:
              - 'users/follows/follow-business/**'
            users-unfollow:
              - 'users/follows/unfollow-business/**'
            users-get-following-businesses:
              - 'users/follows/get-following-businesses/**'

            users-business-like:
              - 'users/likes/business-like/**'
            users-business-dislike:
              - 'users/likes/business-dislike/**'

            users-followed-business-spotlights:
              - 'users/spotlights/followed_business_spotlights/**'
            users-get-liked-spotlights:
              - 'users/spotlights/get_liked_spotlights/**'
            users-get-spotlight-by-location:
              - 'users/spotlights/get_spotlight_by_location/**'

  business-register:
    needs: detect-changes
    if: needs.detect-changes.outputs.business-register == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: business-register
      working-directory: auth/business/register
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  business-login:
    needs: detect-changes
    if: needs.detect-changes.outputs.business-login == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      working-directory: auth/business/login
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

# --------------------- Auth ------------------
  user-login:
    needs: detect-changes
    if: needs.detect-changes.outputs.user-login == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: user-login
      working-directory: auth/user/login
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  user-register:
    needs: detect-changes
    if: needs.detect-changes.outputs.user-register == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: user-register
      working-directory: auth/user/register
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

# --------------------- Bridge Service ------------------
  bridge-service-push-notification:
    needs: detect-changes
    if: needs.detect-changes.outputs.bridge-service-push-notification == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: push_notification
      working-directory: bridge-service/push_notification
      gcp_region: ${{ vars.GCP_REGION }}
      tf_vars: >-
        -var="topic=${{ vars.GCP_TOPIC_PUSH_NOTIFICATION }}"
    secrets: inherit


# --------------------- Business ------------------
  business-categories-add:
    needs: detect-changes
    if: needs.detect-changes.outputs.business-categories-add == 'true'
