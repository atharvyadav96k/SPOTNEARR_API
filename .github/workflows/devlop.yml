name: Multiple Go Functions Deploy

on:
  push:
    branches:
      - main
    paths:
      # ----------- Auth Functions ---------
      - 'auth/business/register/**'
      - 'auth/business/login/**'
      - 'auth/user/login/**'
      - 'auth/user/register/**'

      # ----------- Bridge Service Functions ---------
      - 'bridge-service/filter-follow/**'
      - 'bridge-service/filter-likes/**'
      - 'bridge-service/push_notification/**'

      # ----------- Business Functions ---------
      - 'business/categories/add_categories/**'
      - 'business/categories/get_categories/**'

      - 'business/plans/add_plans/**'
      - 'business/plans/get_active_plan/**'
      - 'business/plans/get_business_plans/**'
      - 'business/plans/set_business_active_plan/**'

      - 'business/follow/follow/**'
      - 'business/follow/unfollow/**'
      - 'business/follow/get_followers/**'

      # ---------- User Functions ---------
      - 'users/follow/follow/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      # ---------- Auth Functions ---------
      business-register: ${{ steps.filter.outputs.business-register }}
      business-login: ${{ steps.filter.outputs.business-login }}
      user-login: ${{ steps.filter.outputs.user-login }}
      user-register: ${{ steps.filter.outputs.user-register }}

      # --------- Bridge Service Functions ---------
      bridge-service-follow: ${{ steps.filter.outputs.bridge-service-follow }}
      bridge-service-like: ${{ steps.filter.outputs.bridge-service-like }}
      bridge-service-push-notification: ${{ steps.filter.outputs.bridge-service-push-notification }}
      
      # --------- Business Functions ---------
      business-categories-add: ${{ steps.filter.outputs.business-categories-add }}
      business-categories-get: ${{ steps.filter.outputs.business-categories-get }}

      business-plans-add: ${{ steps.filter.outputs.business-plans-add }}
      business-plans-get-active: ${{ steps.filter.outputs.business-plans-get-active }}
      business-plans-get-business: ${{ steps.filter.outputs.business-plans-get-business }}
      business-plans-set-active: ${{ steps.filter.outputs.business-plans-set-active }}

      business-follow: ${{ steps.filter.outputs.business-follow }}

      # --------- User Functions ---------
      users-follow: ${{ steps.filter.outputs.users-follow }}
      
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
          
            business-register:
              - 'auth/business/register/**'
            business-login:
              - 'auth/business/login/**'
            user-login:
              - 'auth/user/login/**'      
            user-register:
              - 'auth/user/register/**'  


            bridge-service-follow:
              - 'bridge-service/filter-follows/**'
            bridge-service-like:
              - 'bridge-service/filter-likes/**'
            bridge-service-push-notification:
              - 'bridge-service/push_notification/**'


            business-categories-add:
              - 'business/categories/add_categories/**'
            business-categories-get:
              - 'business/categories/get_categories/**'

            business-plans-add:
              - 'business/plans/add_plans/**'
            business-plans-get-active:
              - 'business/plans/get_active_plan/**'
            business-plans-get-business:
              - 'business/plans/get_business_plans/**'
            business-plans-set-active:
              - 'business/plans/set_business_active_plan/**'

            business-follow:
              - 'business/follow/follow/**'



            users-follow:
              - 'users/follow/follow/**'

  business-register:
    needs: detect-changes
    if: needs.detect-changes.outputs.business-register == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:

      working-directory: auth/business/register
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  business-login:
    needs: detect-changes
    if: needs.detect-changes.outputs.business-login == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      working-directory: auth/business/login
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

# --------------------- Auth ------------------
  user-login:
    needs: detect-changes
    if: needs.detect-changes.outputs.user-login == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      working-directory: auth/user/login
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  user-register:
    needs: detect-changes
    if: needs.detect-changes.outputs.user-register == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      working-directory: auth/user/register
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

# --------------------- Bridge Service ------------------
  bridge-service-follow:
    needs: detect-changes
    if: needs.detect-changes.outputs.bridge-service-follow == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: webhook_follow
      working-directory: bridge-service/filter-follows
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  bridge-service-like:
    needs: detect-changes
    if: needs.detect-changes.outputs.bridge-service-like == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: webhook_like
      working-directory: bridge-service/filter-likes
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  bridge-service-push-notification:
    needs: detect-changes
    if: needs.detect-changes.outputs.bridge-service-push-notification == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: push_notification
      working-directory: bridge-service/push_notification
      gcp_region: ${{ vars.GCP_REGION }}
      tf_vars: >-
        -var="topic=${{ vars.GCP_TOPIC_PUSH_NOTIFICATION }}"
    secrets: inherit


# --------------------- Business ------------------
  business-categories-add:
    needs: detect-changes
    if: needs.detect-changes.outputs.business-categories-add == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: add_categories
      working-directory: business/categories/add_categories
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  business-categories-get:
    needs: detect-changes
    if: needs.detect-changes.outputs.business-categories-get == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: get_categories
      working-directory: business/categories/get_categories
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit
  
  business-plans-add:
    needs: detect-changes
    if: needs.detect-changes.outputs.business-plans-add == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: add_plans
      working-directory: business/plans/add_plans
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit
  
  business-plans-get-active:
    needs: detect-changes
    if: needs.detect-changes.outputs.business-plans-get-active == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: get_active_plan
      working-directory: business/plans/get_active_plan
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  business-plans-get-business:
    needs: detect-changes
    if: needs.detect-changes.outputs.business-plans-get-business == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: get_business_plans
      working-directory: business/plans/get_business_plans
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  business-plans-set-active:
    needs: detect-changes
    if: needs.detect-changes.outputs.business-plans-set-active == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: set_business_active_plan
      working-directory: business/plans/set_business_active_plan
      gcp_region: ${{ vars.GCP_REGION }}
    secrets: inherit

  business-follow:
    needs: detect-changes
    if: needs.detect-changes.outputs.business-follow == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: follow
      working-directory: business/follow/follow
      gcp_region: ${{ vars.GCP_REGION }}
      tf_vars: >-
        -var="topic=${{ vars.GCP_TOPIC_FOLLOW }}"
    secrets: inherit

# --------------------- User ------------------

  user-follow:
    needs: detect-changes
    if: needs.detect-changes.outputs.users-follow == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    with:
      function-name: follow
      working-directory: users/follow/follow
      gcp_region: ${{ vars.GCP_REGION }}
      tf_vars: >-
        -var="topic=${{ vars.GCP_TOPIC_FOLLOW }}"
    secrets: inherit