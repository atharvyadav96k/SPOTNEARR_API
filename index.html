<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Turnstile Token Fetcher</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 440px;
            width: 100%;
        }
        h3 { color: #1f2937; margin-top: 0; margin-bottom: 8px; }
        p { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
        .widget-box {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
            min-height: 80px;
        }
        textarea {
            width: 100%;
            height: 110px;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background-color: #f9fafb;
            font-family: monospace;
            font-size: 12px;
            resize: none;
            box-sizing: border-box;
            color: #4b5563;
        }
        .badge {
            margin-top: 12px;
            display: inline-block;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            background-color: #d1fae5;
            color: #065f46;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .badge.show { opacity: 1; }
        .error { color: #dc2626; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Turnstile Token Fetcher</h3>
        <p id="instructionText">Detecting sitekey configuration...</p>

        <div class="widget-box" id="captchaContainer"></div>

        <textarea id="outputToken" placeholder="Waiting for verification..." readonly></textarea>
        <div id="copyBadge" class="badge">✓ Token copied to clipboard!</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const siteKey = urlParams.get('sitekey');
        
        const container = document.getElementById('captchaContainer');
        const instruction = document.getElementById('instructionText');

        if (!siteKey) {
            container.innerHTML = "<span class='error'>URL Variable Missing!<br>Please add ?sitekey=YOUR_KEY to the URL</span>";
        } else {
            instruction.innerText = `Running configuration for sitekey: ${siteKey.substring(0, 10)}...`;
            
            window.onload = function() {
                turnstile.render('#captchaContainer', {
                    sitekey: siteKey,
                    callback: handleToken,
                });
            };
        }

        function handleToken(token) {
            const outputBox = document.getElementById('outputToken');
            const badge = document.getElementById('copyBadge');
            
            outputBox.value = token;
            
            navigator.clipboard.writeText(token).then(() => {
                badge.classList.add('show');
                setTimeout(() => badge.classList.remove('show'), 3000);
            }).catch(err => {
                console.error('Auto-copy blocked: ', err);
            });
        }
    </script>

</body>
</html>
